name: NFR Gate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nfr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Audit web runtime dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Audit worker runtime dependencies
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: Audit backend packages
        run: |
          set -euo pipefail
          dotnet restore backend/Postern.slnx
          dotnet list backend/Postern.slnx package --vulnerable --include-transitive \
            | tee artifacts-vulnerabilities.txt
          if grep -qi "has the following vulnerable packages" artifacts-vulnerabilities.txt; then
            echo "Vulnerable NuGet packages were reported above." >&2
            exit 1
          fi

  authorization-and-throttles:
    name: Authorization and throttles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run administrative route and throttle checks
        run: |
          dotnet test backend/tests/Postern.IntegrationTests \
            --filter "FullyQualifiedName~AdminRouteInventoryTests|FullyQualifiedName~RateLimitPolicyTests|FullyQualifiedName~CapacityEnvelopeTests|FullyQualifiedName~Ingest_WithConcurrentDuplicate" \
            --logger "trx;LogFileName=nfr.trx" \
            --results-directory artifacts/nfr

      - name: Upload NFR test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-test-report
          path: artifacts/nfr
          if-no-files-found: ignore
          retention-days: 14

  worker-coverage:
    name: Worker coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - run: npm run test:coverage
        working-directory: worker
