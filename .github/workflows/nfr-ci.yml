name: NFR Gate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nfr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Audit web runtime dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Audit worker runtime dependencies
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: Audit backend packages
        run: |
          set -euo pipefail
          dotnet restore backend/Postern.slnx
          dotnet list backend/Postern.slnx package --vulnerable --include-transitive \
            | tee artifacts-vulnerabilities.txt
          if grep -qi "has the following vulnerable packages" artifacts-vulnerabilities.txt; then
            echo "Vulnerable NuGet packages were reported above." >&2
            exit 1
          fi

  authorization-and-throttles:
    name: Authorization and throttles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Run shared-contract unit checks
        run: |
          dotnet test backend/tests/Postern.UnitTests \
            --filter "FullyQualifiedName~RateLimitMapRebuildTests|FullyQualifiedName~IngestBlockedTests|FullyQualifiedName~Etld1ParityTests|FullyQualifiedName~KvRecordContractTests|FullyQualifiedName~GlobalBlocklistServiceTests|FullyQualifiedName~SuspendedUserServiceTests" \
            --logger "trx;LogFileName=unit-nfr.trx" \
            --results-directory artifacts/nfr

      - name: Run administrative route, throttle, and critical-path checks
        run: |
          dotnet test backend/tests/Postern.IntegrationTests \
            --filter "FullyQualifiedName~AdminRouteInventoryTests|FullyQualifiedName~RateLimitPolicyTests|FullyQualifiedName~CapacityEnvelopeTests|FullyQualifiedName~Ingest_WithConcurrentDuplicate|FullyQualifiedName~RateLimitProjectionWorkerTests|FullyQualifiedName~CriticalPathInventoryTests|FullyQualifiedName~AuthenticationEndpointsTests|FullyQualifiedName~InviteDeliveryEndpointsTests|FullyQualifiedName~AliasEndpointsTests|FullyQualifiedName~IngestFlowTests|FullyQualifiedName~ActivityEndpointsTests|FullyQualifiedName~DatabaseSchemaTests|FullyQualifiedName~DataProtectionRestartTests|FullyQualifiedName~ProjectionRebuildTests|FullyQualifiedName~AdminAuditTests" \
            --logger "trx;LogFileName=nfr.trx" \
            --results-directory artifacts/nfr

      - name: Upload NFR test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfr-test-report
          path: artifacts/nfr
          if-no-files-found: ignore
          retention-days: 14

  worker-coverage:
    name: Worker coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: worker

      - run: npm run test:coverage
        working-directory: worker

      - name: Record per-message CPU cost
        run: npm run measure:cpu
        working-directory: worker

      - name: Upload CPU measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-cpu-measurement
          path: worker/perf/cpu-measurement.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload worker coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-coverage
          path: worker/coverage
          if-no-files-found: error
          retention-days: 14
