name: Web CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan for committed secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -z "${BEFORE_SHA:-}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          else
            range="${BEFORE_SHA}..${CURRENT_SHA}"
          fi
          echo "Scanning commit range: ${range}"
          gitleaks detect --source . --config .gitleaks.toml --log-opts="${range}" --redact --verbose

  build-and-test:
    name: Build and test
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      - name: Run tests with coverage
        working-directory: web
        run: npm run test:coverage

      - name: Run integration tests
        working-directory: web
        run: npm run test:integration -- --no-file-parallelism

      - name: Summarise coverage
        if: always()
        working-directory: web
        run: npm run coverage:summary

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore
          retention-days: 14

  image-scan:
    name: Container image scan
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build web image
        run: docker build -t postern-web:ci web

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: postern-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-web.txt

      - name: Show Trivy findings
        if: always()
        run: cat trivy-web.txt || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-web-report
          path: trivy-web.txt
          if-no-files-found: ignore
          retention-days: 14
