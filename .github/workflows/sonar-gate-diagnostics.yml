name: Sonar gate diagnostics

on:
  workflow_dispatch:
    inputs:
      metric_keys:
        description: Comma-separated Sonar metric keys to print
        required: false
        default: "new_coverage,new_lines_to_cover,new_uncovered_lines,new_conditions_to_cover,new_uncovered_conditions,new_lines,new_duplicated_lines_density"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      METRIC_KEYS: ${{ inputs.metric_keys }}
    steps:
      - name: Report main-branch quality gate and new-code metrics
        run: |
          set -euo pipefail
          : "${SONAR_TOKEN:?SONAR_TOKEN is required}"
          project_key="${SONAR_PROJECT_KEY:-Zelamene_Postern}"
          echo "=== project_status ==="
          curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${project_key}&branch=main" \
            | python3 -m json.tool
          echo "=== measures ==="
          curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/measures/component?component=${project_key}&branch=main&metricKeys=${METRIC_KEYS}" \
            | python3 -m json.tool
          echo "=== file-level new coverage (top 40 by uncovered new lines) ==="
          curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/measures/component_tree?component=${project_key}&branch=main&qualifiers=FIL&metricKeys=new_lines_to_cover,new_uncovered_lines,new_coverage&ps=500" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          rows = []
          for c in data.get("components", []):
              vals = {}
              for m in c.get("measures", []):
                  value = m.get("value")
                  if value is None and m.get("periods"):
                      value = m["periods"][0].get("value", "0")
                  vals[m["metric"]] = value or "0"
              try:
                  tot = int(float(vals.get("new_lines_to_cover", 0)))
                  unc = int(float(vals.get("new_uncovered_lines", 0)))
              except ValueError:
                  continue
              if tot:
                  rows.append((unc, tot, c.get("path", "")))
          for unc, tot, path in sorted(rows, reverse=True)[:40]:
              print(f"{unc:5d}/{tot:5d} uncovered  {path}")
          '
          echo "=== open vulnerabilities (all severities) ==="
          curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?projects=${project_key}&branch=main&types=VULNERABILITY&statuses=OPEN,CONFIRMED,REOPENED&ps=500" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          print("total:", data.get("total"))
          for i in data.get("issues", []):
              print(" | ".join(str(i.get(k, "")) for k in ("key", "severity", "rule", "component", "line", "creationDate")))
              print("   MSG:", i.get("message", ""))
          '
          echo "=== open security hotspots ==="
          curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?projects=${project_key}&branch=main&types=SECURITY_HOTSPOT&statuses=OPEN,REVIEWED&ps=500" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          print("total:", data.get("total"))
          for i in data.get("issues", []):
              print(" | ".join(str(i.get(k, "")) for k in ("key", "status", "rule", "component", "line", "creationDate")))
              print("   MSG:", i.get("message", ""))
          '
