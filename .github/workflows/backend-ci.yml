name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan for committed secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -z "${BEFORE_SHA:-}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          else
            range="${BEFORE_SHA}..${CURRENT_SHA}"
          fi
          echo "Scanning commit range: ${range}"
          gitleaks detect --source . --config .gitleaks.toml --log-opts="${range}" --redact --verbose

  build-and-test:
    name: Build and test
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore dependencies
        run: dotnet restore backend/Postern.slnx

      - name: Audit NuGet dependencies
        run: |
          set -o pipefail
          dotnet list backend/Postern.slnx package --vulnerable --include-transitive | tee nuget-vulnerabilities.txt
          if grep -q "has the following vulnerable packages" nuget-vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet packages were found; review nuget-vulnerabilities.txt"
            exit 1
          fi

      - name: Build solution
        run: dotnet build backend/Postern.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test backend/tests/Postern.UnitTests \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory artifacts/unit

      - name: Run integration tests
        run: |
          dotnet test backend/tests/Postern.IntegrationTests \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory artifacts/integration

      - name: Merge coverage reports
        if: always()
        run: |
          set -euo pipefail
          report_count=$(find artifacts -name 'coverage.cobertura.xml' | wc -l)
          if [ "$report_count" -eq 0 ]; then
            echo "No coverage reports were produced; skipping the merge."
            exit 0
          fi

          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:artifacts/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage" \
            "-reporttypes:Html;Cobertura;TextSummary;MarkdownSummaryGithub" \
            "-filefilters:-**/Migrations/**;-**/PosternDesignTimeDbContextFactory.cs" \
            "-assemblyfilters:-*.Tests" \
            "-verbosity:Warning"

          echo "Merged coverage:"
          cat artifacts/coverage/Summary.txt
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-reports
          path: |
            artifacts/**
            nuget-vulnerabilities.txt
          if-no-files-found: ignore
          retention-days: 14

  migration-check:
    name: Migrations from an empty database
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postern_ci
          POSTGRES_PASSWORD: postern_ci_password
          POSTGRES_DB: postern_ci
        options: >-
          --health-cmd "pg_isready -U postern_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTERN_MIGRATOR_CONNECTION_STRING: "Host=localhost;Port=5432;Database=postern_ci;Username=postern_ci;Password=postern_ci_password"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore backend/Postern.slnx

      - name: Apply every migration to an empty database
        run: |
          dotnet ef database update \
            --project backend/src/Postern.Infrastructure \
            --startup-project backend/src/Postern.Api

      - name: Verify the model matches the migrations
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/Postern.Infrastructure \
            --startup-project backend/src/Postern.Api

  image-scan:
    name: Container image scan
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build backend image
        run: docker build --target production -t postern-backend:ci backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: postern-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-backend.txt

      - name: Show Trivy findings
        if: always()
        run: cat trivy-backend.txt || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-backend-report
          path: trivy-backend.txt
          if-no-files-found: ignore
          retention-days: 14
