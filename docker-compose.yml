services:
  db:
    image: postgres:17-alpine
    env_file:
      - ./env/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postern-db:/var/lib/postgresql/data
      - ./database/init/10-postern-roles.sql:/docker-entrypoint-initdb.d/10-postern-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./env/api.env
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    volumes:
      - ./backend:/workspace
      - /workspace/src/Postern.Api/bin
      - /workspace/src/Postern.Api/obj
      - /workspace/src/Postern.Application/bin
      - /workspace/src/Postern.Application/obj
      - /workspace/src/Postern.Domain/bin
      - /workspace/src/Postern.Domain/obj
      - /workspace/src/Postern.Infrastructure/bin
      - /workspace/src/Postern.Infrastructure/obj
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - ./env/web.env
    ports:
      - "127.0.0.1:5173:5173"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postern-db:
