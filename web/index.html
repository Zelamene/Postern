<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/postern.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#74172a" />
    <meta name="description" content="A single-purpose, auditable email alias platform." />
    <title>Postern</title>
    <script>
      (() => {
        const stored = localStorage.getItem('postern-theme')
        const dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'

        if (location.pathname === '/' || location.pathname === '/index.html') {
          const base = '/media/hero/hero-' + (dark ? 'dark' : 'light')
          const preload = document.createElement('link')
          preload.rel = 'preload'
          preload.as = 'image'
          preload.type = 'image/avif'
          preload.setAttribute('fetchpriority', 'high')
          preload.setAttribute('imagesrcset', base + '-1200.avif 1200w, ' + base + '.avif 1672w')
          preload.setAttribute('imagesizes', '(min-width: 1024px) 58vw, 100vw')
          preload.setAttribute('media', '(min-width: 1024px) and (min-height: 600px)')
          document.head.appendChild(preload)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
